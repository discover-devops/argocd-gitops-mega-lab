apiVersion: v1
kind: Service
metadata:
  name: taskflow-postgres
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-postgres
    app.kubernetes.io/part-of: taskflow
spec:
  clusterIP: None          # headless service for the StatefulSet
  selector:
    app.kubernetes.io/name: taskflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskflow-postgres
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-postgres
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/component: database
spec:
  serviceName: taskflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-postgres
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: taskflow-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
