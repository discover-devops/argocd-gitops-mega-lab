# Builds and pushes the TaskFlow images to Docker Hub.
# Trainer runs this once before class (Actions tab -> Run workflow).
# Required repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: Build TaskFlow images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            discoverdevops/taskflow-${{ matrix.component }}:${{ inputs.version }}
            discoverdevops/taskflow-${{ matrix.component }}:latest
