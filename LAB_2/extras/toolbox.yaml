# Lab 2: a small debug toolbox pod.
# You add it through Git, use it, then remove it from Git to learn about prune.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-toolbox
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-toolbox
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/component: debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-toolbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-toolbox
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/component: debug
    spec:
      containers:
        - name: toolbox
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
