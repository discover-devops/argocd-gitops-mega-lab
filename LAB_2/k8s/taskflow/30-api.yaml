apiVersion: v1
kind: Service
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/part-of: taskflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-api
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: discoverdevops/taskflow-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # ---- Lab 2 starts here: this is where Lab 1 ended ----
            - name: APP_VERSION
              value: "1.1.0"
            - name: APP_MESSAGE
              value: "Changed through Git - no kubectl!"
            - name: APP_ENV
              value: "dev"
            # --------------------------------------------------------------------
            - name: DB_HOST
              value: taskflow-postgres
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: taskflow-db, key: POSTGRES_DB }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: taskflow-db, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: taskflow-db, key: POSTGRES_PASSWORD }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
