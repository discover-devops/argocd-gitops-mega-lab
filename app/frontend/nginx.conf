server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend health check for Kubernetes probes
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Proxy API calls to the taskflow-api Service inside the cluster
    location /api/ {
        proxy_pass http://taskflow-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
