# Wave 1: Postgres and its secret. The API cannot start without it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/<YOUR_GITHUB_USER>/argocd-gitops-mega-lab.git
    targetRevision: main
    path: LAB_3/workloads/database
  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
